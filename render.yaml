services:
  - type: web
    name: jm-dashboard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn dashboard.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ALLOW_SCHEMA_MUTATIONS
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: TRUST_PROXY_SSL_HEADER
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "0"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: jm-dashboard-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_API_URL
        sync: false
